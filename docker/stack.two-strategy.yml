version: "3.8"

services:
  web:
    image: nginxinc/nginx-unprivileged:stable-alpine
    networks:
      - gateway
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        traefik.enable: "true"
        traefik.docker.network: gateway
        traefik.http.routers.juicenomics-two-strategy.rule: Host(`juicenomics-two-strategy.lark.hydration.cloud`)
        traefik.http.routers.juicenomics-two-strategy.entrypoints: websecure
        traefik.http.routers.juicenomics-two-strategy.tls: "true"
        traefik.http.routers.juicenomics-two-strategy.tls.certresolver: myresolver
        traefik.http.routers.juicenomics-two-strategy.service: juicenomics-two-strategy
        traefik.http.services.juicenomics-two-strategy.loadbalancer.server.port: "8080"

networks:
  gateway:
    external: true
