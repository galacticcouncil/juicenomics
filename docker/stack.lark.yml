version: "3.8"

services:
  web:
    image: nginxinc/nginx-unprivileged:stable-alpine
    networks:
      - gateway
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        traefik.enable: "true"
        traefik.docker.network: gateway
        traefik.http.routers.juicenomics.rule: Host(`juicenomics.lark.hydration.cloud`)
        traefik.http.routers.juicenomics.entrypoints: websecure
        traefik.http.routers.juicenomics.tls: "true"
        traefik.http.routers.juicenomics.tls.certresolver: myresolver
        traefik.http.routers.juicenomics.service: juicenomics
        traefik.http.services.juicenomics.loadbalancer.server.port: "8080"
        # the old name keeps working: browsers keep a share link's #fragment across the redirect
        traefik.http.routers.juicenomics-legacy.rule: Host(`juicer-sim.lark.hydration.cloud`)
        traefik.http.routers.juicenomics-legacy.entrypoints: websecure
        traefik.http.routers.juicenomics-legacy.tls: "true"
        traefik.http.routers.juicenomics-legacy.tls.certresolver: myresolver
        traefik.http.routers.juicenomics-legacy.service: juicenomics
        traefik.http.routers.juicenomics-legacy.middlewares: juicenomics-legacy
        traefik.http.middlewares.juicenomics-legacy.redirectregex.regex: ^https?://juicer-sim\.lark\.hydration\.cloud/(.*)
        traefik.http.middlewares.juicenomics-legacy.redirectregex.replacement: https://juicenomics.lark.hydration.cloud/$${1}
        traefik.http.middlewares.juicenomics-legacy.redirectregex.permanent: "true"

networks:
  gateway:
    external: true
